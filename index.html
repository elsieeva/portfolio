<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elsie Thomas Portfolio </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="frame">
  <div class="stage" id="gardenStage">

    <div class="art-panel">
<div class="art-slot" id="artSlot">
  <img src="images/pot.svg" style="position:absolute; top:45%; left:0; width:100%; height:100%; object-fit:contain; z-index: 10;">
  <svg viewBox="0 0 300 300" ...>

          <!-- ================= SPROUT: fanpass ================= -->
        <div class="sprout" data-project="fanpass" style="position:absolute; left:20%; top:0%; width:25%;">
            <img class="presprout" src="images/fanpass-stem.svg" style="width:100%; display:block;">
            <img class="grown" src="images/fanpass-bloom.svg" style="position:absolute; top:0; left:0; width:100%;">
          </div>

          <!-- ================= SPROUT: mise ================= -->
          <div class="sprout" data-project="mise" style="position:absolute; left:40%; top:15%; width:25%;">
            <img class="presprout" src="images/mise-stem.svg" style="width:100%; display:block;">
            <img class="grown" src="images/mise-bloom.svg" style="position:absolute; top:0; left:0; width:100%;">
          </div>
          <!-- ================= SPROUT: run-buddy (forked, two blooms) ================= -->
          <div class="sprout" data-project="run-buddy" style="position:absolute; left:57%; top:-3%; width:25%;">
            <img class="presprout" src="images/run-buddy-stem.svg" style="width:100%; display:block;">
            <img class="grown" src="images/run-buddy-bloom.svg" style="position:absolute; top:0; left:0; width:100%;">
          </div>
          <!-- ================= SPROUT: asl-classifier ================= -->
          <div class="sprout" data-project="asl-classifier" style="position:absolute; left:75%; top:20%; width:25%;">
            <img class="presprout" src="images/asl-stem.svg" style="width:100%; display:block;">
            <img class="grown" src="images/asl-bloom.svg" style="position:absolute; top:-10%; left:10%; width:100%;">
          </div>
          <!-- ================= SPROUT: os-shell ================= -->
          <div class="sprout" data-project="os-shell" style="position:absolute; left:0%; top:5%; width:25%;">
            <img class="presprout" src="images/os-shell-stem.svg" style="width:100%; display:block;">
            <img class="grown" src="images/os-shell-bloom.svg" style="position:absolute; top:0; left:0; width:100%;">
          </div>

<div class="tooltip" data-tip="fanpass" style="left:31%; top:5%;">fanpass</div>
<div class="tooltip" data-tip="mise" style="left:50%; top:20%;">mise</div>
<div class="tooltip" data-tip="run-buddy" style="left:70%; top:0%;">run buddy</div>
<div class="tooltip" data-tip="asl-classifier" style="left:90%; top:20%;">asl classifier</div>
<div class="tooltip" data-tip="os-shell" style="left:10%; top:10%;">os shell</div>
      </div>

      <div class="butterfly" id="bfly-rythmeet" data-exp="rythmeet">
        <div class="bfly-tip">rythmeet</div>
        <img src="images/rythmeetbutterfly.png" style="width:100%; height:100%; display:block;">
      </div>

      <div class="butterfly" id="bfly-wsum" data-exp="wsum">
        <div class="bfly-tip">wsum</div>
        <img src="images/wsumbutterfly.png" style="width:100%; height:100%; display:block;">
      </div>
    </div>

    <div class="copy-panel" id="copyPanel">
      <div class="panel-content" id="panelContent">
        <!-- filled by js/script.js -->
      </div>
    </div>

  </div>

  <div class="stage contact-stage" id="contactStage" style="display:none;">
    <div class="copy-panel contact-info-panel">
      <div class="panel-content" id="contactPanelContent">
        <!-- filled by js/script.js -->
      </div>
    </div>
    <div class="art-panel contact-photo-panel">
      <!-- swap this filename for your own photo, dropped into the images folder -->
      <img class="contact-photo" src="images/elsiethomas.jpg" alt="Elsie Thomas">
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
